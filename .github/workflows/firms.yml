name: firms
# 매시간 NASA FIRMS 열점(state/firms.json + 유형 추정 이력 state/firms_cells.json, 키 시크릿 FIRMS_KEY)과 한반도 항공 지표(state/air.json, 키 불필요)를 갱신한다.
# 국내 언론 RSS 키워드 건수(state/news_kr.json, 공개판 — 제목·링크 없음)도 받는다.
# 국내 항행경보(state/navwarn_kr.json, 키 시크릿 DATA_GO_KR_KEY — KHOA 해상사격훈련, 북한 발사 통보 오탐 억제용)도 같은 잡에서 받는다.
# 접경 지자체 육상 사격훈련 공지(state/drills_kr.json, 키 불필요)도 받는다.
# 15분 주기(10/24 hayden — 수집은 공개 레포 GHA 무료). :45 회차가 :07 감시 루틴 직전 판을 만든다.
# 항공 기준선은 「같은 시각대 지난 7일 중앙값」이라 회차가 늘어도 의미가 같다. Overpass 는 회차당 120s 상한 + 격자 캐시.
on:
  schedule: [{ cron: "0,15,30,45 * * * *" }]
  workflow_dispatch:

permissions: { contents: write }
concurrency: { group: firms, cancel-in-progress: false }

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 유형 추정 Overpass 상한 120s(firms.OSM_BUDGET_S) + 토지피복 상한 60s(firms.LC_BUDGET_S, 10/28 실측 칸당 ≈0.6s) 포함.
    # 8분이던 때 navwarn 3.5분 + drills 4분에 걸려 잡이 취소되고 그 회차 수집분이 커밋 전에 버려졌다(11-09 run 42561204273). 단계별 실측 최대 합 ≈670s
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        # 이벤트 시점 커밋(github.sha)이 아니라 main 끝을 받는다 — 맥 킥 dispatch 와 늦은 schedule 이 같은 커밋에서 출발해
        # 같은 state 를 따로 써 충돌했다(10-30·10-31). concurrency 로 줄 선 뒤 회차가 앞 회차 push 위에서 시작한다
        with: { ref: main }
      - name: fetch
        id: fetch
        # FIRMS 통신 실패(rc 3, 3회 재시도 뒤)는 이 스텝만 실패로 표시하고 다른 갱신·커밋은 계속한다. rc 3 은 state/firms.json 을 쓰기 전에 끝난다
        continue-on-error: true
        env: { FIRMS_KEY: "${{ secrets.FIRMS_KEY }}" }
        run: python3 scripts/firms.py
      - name: air
        run: python3 scripts/air_count.py   # 실패해도 기존 파일 유지(rc 0)
      - name: navwarn_kr
        # 실패(rc 3: 키 미활성·한도·통신)는 이 스텝을 실패로 표시하되 열점 커밋은 계속한다. 상태는 산출물 status 에도 남는다
        continue-on-error: true
        timeout-minutes: 5
        env: { DATA_GO_KR_KEY: "${{ secrets.DATA_GO_KR_KEY }}" }
        run: python3 scripts/navwarn_kr.py
      - name: news_kr
        # 국내 언론 RSS 키워드 수집(정본 data/sources.json feeds · data/news_keywords.json). 공개판(--public)이라 건수·상태만 커밋한다 —
        # 제목·링크는 레포에 올리지 않는다(채택 매체 RSS 는 개인 구독 한정). 피드 실패(rc 3)는 이 스텝만 실패로 표시하고 다른 갱신은 계속한다
        continue-on-error: true
        timeout-minutes: 3
        run: python3 scripts/news_kr.py --public
      - name: drills_kr
        # 접경 지자체 육상 사격훈련 공지(철원 RSS·고성 공지·파주 새소식+HWP·화천 공지+PDF, 공개 게시판). 참고 자료 — 등급과 무관. 직전 성공 6시간 안이면 건너뛴다.
        # 해외 러너에서 막히면(rc 3 연속) 사무실 맥 경유로 옮긴다
        # 파주 HWP·화천 PDF 첨부 해석에 olefile·pypdf 가 필요하다(설치 실패면 그 첨부만 건너뛰고 본문만 쓴다)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 -m pip install -q --user --break-system-packages olefile==0.47 pypdf==6.14.2 || echo "첨부 해석기 설치 실패 — 본문만"
          python3 scripts/drills_kr.py
      - name: obs_link
        # 접경 열점을 사건 후보로 묶고 사격 공지와 날짜를 대조한다(state/obs_candidates.json — 판정 루틴의 보도 대조 입력, 등급과 무관).
        # 입력(firms·drills_kr)이 그대로면 산출도 바이트 동일이라 커밋을 만들지 않는다. 실패해도 다른 갱신은 계속한다
        continue-on-error: true
        run: python3 scripts/obs_link.py
      - name: firms_note
        if: steps.fetch.outcome == 'failure'
        run: echo "FIRMS 수집 실패 — state/firms.json 미갱신(직전 값 유지)" >> "$GITHUB_STEP_SUMMARY"
      - name: commit
        run: |
          [ -z "$(git status --porcelain -- state/firms.json state/firms_cells.json state/air.json state/air.jsonl state/navwarn_kr.json state/news_kr.json state/drills_kr.json state/obs_candidates.json)" ] && { echo unchanged; exit 0; }  # 신규 파일도 변경으로 본다
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state/firms.json $(ls state/firms_cells.json state/air.json state/air.jsonl state/navwarn_kr.json state/news_kr.json state/drills_kr.json state/obs_candidates.json 2>/dev/null)
          git commit -m "firms: $(date -u +%FT%H:%MZ)"
          # 커밋 밖 추적 파일 변경이 남으면 pull --rebase 가 거절한다(11-03 drills_kr 시간 초과 회차) — 이름을 남기고 버린다
          left=$(git status --porcelain --untracked-files=no)
          [ -n "$left" ] && { echo "커밋 밖 변경 버림:"; echo "$left"; git reset -q --hard HEAD; }
          # 루틴·calendar 커밋과 경합한다(10/24 실측 60회 중 4회 실패) — 6회·무작위 대기로 재시도.
          # 회차가 실패하면 rebase 를 거두고 이번 커밋으로 되돌린다 — 중간 상태가 남으면 남은 회차가 모두 실패한다(10-31).
          # -X theirs = 충돌 칸은 이번 회차 값. 이 파일들은 firms 회차만 쓰고 줄을 섰으니 늦게 push 하는 쪽이 늦게 수집한 쪽이다
          own=$(git rev-parse HEAD)
          for i in 1 2 3 4 5 6; do
            git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            git reset -q --hard "$own"
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
