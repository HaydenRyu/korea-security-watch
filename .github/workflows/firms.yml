name: firms
# 매시간 NASA FIRMS 열점(state/firms.json + 유형 추정 이력 state/firms_cells.json, 키 시크릿 FIRMS_KEY)과 한반도 항공 지표(state/air.json, 키 불필요)를 갱신한다.
# 국내 언론 RSS 키워드 건수(state/news_kr.json, 공개판 — 제목·링크 없음)도 받는다.
# 국내 항행경보(state/navwarn_kr.json, 키 시크릿 DATA_GO_KR_KEY — KHOA 해상사격훈련, 북한 발사 통보 오탐 억제용)도 같은 잡에서 받는다.
# 감시 루틴은 :07 에 돈다. 그 전에 끝나도록 :45 에 받는다.
on:
  schedule: [{ cron: "45 * * * *" }]
  workflow_dispatch:

permissions: { contents: write }
concurrency: { group: firms, cancel-in-progress: false }

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # 유형 추정 Overpass 상한 120s(firms.OSM_BUDGET_S) 포함
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        env: { FIRMS_KEY: "${{ secrets.FIRMS_KEY }}" }
        run: python3 scripts/firms.py
      - name: air
        run: python3 scripts/air_count.py   # 실패해도 기존 파일 유지(rc 0)
      - name: navwarn_kr
        # 실패(rc 3: 키 미활성·한도·통신)는 이 스텝을 실패로 표시하되 열점 커밋은 계속한다. 상태는 산출물 status 에도 남는다
        continue-on-error: true
        env: { DATA_GO_KR_KEY: "${{ secrets.DATA_GO_KR_KEY }}" }
        run: python3 scripts/navwarn_kr.py
      - name: news_kr
        # 국내 언론 RSS 키워드 수집(정본 data/sources.json feeds · data/news_keywords.json). 공개판(--public)이라 건수·상태만 커밋한다 —
        # 제목·링크는 레포에 올리지 않는다(채택 매체 RSS 는 개인 구독 한정). 피드 실패(rc 3)는 이 스텝만 실패로 표시하고 다른 갱신은 계속한다
        continue-on-error: true
        timeout-minutes: 3
        run: python3 scripts/news_kr.py --public
      - name: commit
        run: |
          [ -z "$(git status --porcelain -- state/firms.json state/firms_cells.json state/air.json state/air.jsonl state/navwarn_kr.json state/news_kr.json)" ] && { echo unchanged; exit 0; }  # 신규 파일도 변경으로 본다
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state/firms.json $(ls state/firms_cells.json state/air.json state/air.jsonl state/navwarn_kr.json state/news_kr.json 2>/dev/null)
          git commit -m "firms: $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
