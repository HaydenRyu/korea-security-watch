name: notify
# 루틴이 state/outbox.json 을 바꿔 push 하면 ntfy 로 발송한다(본인 주제 · 지인 주제).
# 방문자(public) 메시지는 상황판에서 「알림 받기」를 누른 방문자에게 웹 푸시로 보낸다(Worker /push/send). 주의 이상부터.
# 두 발송은 독립이다 — 한쪽이 실패해도 다른 쪽은 돈다(실패한 쪽이 잡을 빨갛게 만든다).
on:
  push:
    branches: [main]
    paths: [state/outbox.json]
  workflow_dispatch:
    inputs:
      text:
        description: 본인 주제로 보낼 테스트 메시지
        required: true
        default: 안보 감시 테스트 메시지
      push_sub:
        description: "웹 푸시 구독 id 하나(KV 키의 sub: 뒤 해시) — 비우면 ntfy 테스트만"
        required: false
        default: ""

concurrency: { group: notify, cancel-in-progress: false }

jobs:
  send:
    # 2026-11-24 헤이든 지시 「GitHub 호스티드 러너 0」(공개 레포 무료분도 예외 없음) — 2호기(worker2) self-hosted.
    # 개인 레포라 org 러너가 배정되지 않아 이 레포 단위 러너(라벨 worker2) 등록이 선행돼야 한다(사람 몫). 롤백 = runs-on 을 ubuntu-latest 로 되돌리는 커밋 1개
    runs-on: [self-hosted, worker2]
    timeout-minutes: 5
    env:
      NTFY_TOPIC_ME: ${{ secrets.NTFY_TOPIC_ME }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      # 러너 맥의 시스템 python3(버전 미정)에 기대지 않는다 — 호스티드와 같은 3.12 를 툴캐시로 고정
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: send outbox
        if: github.event_name == 'push'
        run: python3 scripts/ntfy_send.py outbox state/outbox.json
      - name: web push (visitors)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        env: { PUSH_TOKEN: "${{ secrets.PUSH_TOKEN }}" }
        run: python3 scripts/push_send.py outbox state/outbox.json
      - name: send test
        if: github.event_name == 'workflow_dispatch' && inputs.push_sub == ''
        env: { TEXT: "${{ inputs.text }}" }
        run: python3 scripts/ntfy_send.py me "안보 감시 테스트" "$TEXT"
      - name: web push test (one subscription)
        if: github.event_name == 'workflow_dispatch' && inputs.push_sub != ''
        env: { PUSH_TOKEN: "${{ secrets.PUSH_TOKEN }}", SUB: "${{ inputs.push_sub }}" }
        run: python3 scripts/push_send.py test "$SUB"
