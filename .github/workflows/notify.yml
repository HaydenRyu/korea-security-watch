name: notify
# 루틴이 state/outbox.json 을 바꿔 push 하면 ntfy 로 발송한다(본인 주제 · 지인 주제).
on:
  push:
    branches: [main]
    paths: [state/outbox.json]
  workflow_dispatch:
    inputs:
      text:
        description: 본인 주제로 보낼 테스트 메시지
        required: true
        default: 안보 감시 테스트 메시지

concurrency: { group: notify, cancel-in-progress: false }

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NTFY_TOPIC_ME: ${{ secrets.NTFY_TOPIC_ME }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - name: send outbox
        if: github.event_name == 'push'
        run: python3 scripts/ntfy_send.py outbox state/outbox.json
      - name: send test
        if: github.event_name == 'workflow_dispatch'
        env: { TEXT: "${{ inputs.text }}" }
        run: python3 scripts/ntfy_send.py me "안보 감시 테스트" "$TEXT"
