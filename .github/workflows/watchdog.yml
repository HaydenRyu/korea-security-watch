name: watchdog
# 6시간마다 루틴이 멎었는지(최종 확인 3~9시간 전) 감지해 본인 주제로 1회 알린다
on:
  schedule: [{ cron: "23 */6 * * *" }]
  workflow_dispatch:

concurrency: { group: watchdog, cancel-in-progress: false }

jobs:
  watch:
    # 2026-11-24 헤이든 지시 「GitHub 호스티드 러너 0」(공개 레포 무료분도 예외 없음) — 2호기(worker2) self-hosted.
    # 개인 레포라 org 러너가 배정되지 않아 이 레포 단위 러너(라벨 worker2) 등록이 선행돼야 한다(사람 몫). 롤백 = runs-on 을 ubuntu-latest 로 되돌리는 커밋 1개
    runs-on: [self-hosted, worker2]
    timeout-minutes: 5
    env:
      NTFY_TOPIC_ME: ${{ secrets.NTFY_TOPIC_ME }}
    steps:
      - uses: actions/checkout@v4
      # 러너 맥의 시스템 python3(버전 미정)에 기대지 않는다 — 호스티드와 같은 3.12 를 툴캐시로 고정
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: stale check
        id: stale
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, datetime as dt, pathlib
          p = pathlib.Path("state/events.jsonl")
          lines = [l for l in p.read_text().splitlines() if l.strip()] if p.exists() else []
          if not lines:
              print("stale=0"); raise SystemExit
          last = dt.datetime.fromisoformat(json.loads(lines[-1])["checked_at"])
          h = (dt.datetime.now(dt.timezone.utc) - last).total_seconds() / 3600
          # 6시간 주기라 3~9시간 창이면 정지 1건당 알림 1회
          print(f"stale={int(3 <= h < 9)}"); print(f"hours={h:.1f}")
          EOF
      - name: alert stale
        if: steps.stale.outputs.stale == '1'
        env: { HOURS: "${{ steps.stale.outputs.hours }}" }
        run: python3 scripts/ntfy_send.py me "안보 감시 정지" "마지막 확인 ${HOURS}시간 전. 루틴 상태를 확인하세요." 4
