name: weekly
# 일요일 20:00 KST, 지난 7일 이력 요약을 본인 주제로 1통(우선순위 2 — 조용히). claude 미사용
on:
  schedule: [{ cron: "0 11 * * 0" }]
  workflow_dispatch:

concurrency: { group: weekly, cancel-in-progress: false }

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NTFY_TOPIC_ME: ${{ secrets.NTFY_TOPIC_ME }}
    steps:
      - uses: actions/checkout@v4
      - name: send
        run: |
          python3 scripts/weekly_summary.py > /tmp/w.json
          python3 scripts/ntfy_send.py me "$(jq -r .title /tmp/w.json)" "$(jq -r .message /tmp/w.json)" 2
