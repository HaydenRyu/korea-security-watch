name: weekly
#  summary  — 일요일 20:00 KST, 지난 7일 이력 요약을 본인 주제로 1통(우선순위 2 — 조용히). claude 미사용
#  calendar — 매일 06:10 KST, 도발 위험 일정 집계(scripts/risk_calendar.py → data/risk_calendar.json, 공개 DB·키 불필요)
#             최근 30일 발사 빈도·앞으로 30일 일정이 날마다 바뀌어 매일 돈다(10/18 hayden)
#  imagery  — 같은 calendar 잡 안, 매일: 38 North·Beyond Parallel satellite-imagery 태그 RSS → data/imagery_reports.json(제목·링크·날짜만)
#  conflicts — 같은 calendar 잡 안, 매달 21~28일(KST)만: UCDP Candidate 월간 CSV → data/conflicts.json(scripts/ucdp_month.py, 키 불필요·CC BY 4.0)
#             판은 월말 뒤 약 3주에 나온다. 이미 받은 판이면 받지 않는다. 실패해도 달력 커밋은 그대로 간다(이전 값 유지)
on:
  schedule: [{ cron: "0 11 * * 0" }, { cron: "10 21 * * *" }]
  workflow_dispatch:
    inputs:
      job:
        description: 돌릴 작업
        type: choice
        options: [all, summary, calendar]
        default: all

concurrency: { group: weekly, cancel-in-progress: false }

jobs:
  summary:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 11 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.job != 'calendar')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NTFY_TOPIC_ME: ${{ secrets.NTFY_TOPIC_ME }}
    steps:
      - uses: actions/checkout@v4
      - name: send
        run: |
          python3 scripts/weekly_summary.py > /tmp/w.json
          python3 scripts/ntfy_send.py me "$(jq -r .title /tmp/w.json)" "$(jq -r .message /tmp/w.json)" 2

  calendar:
    if: (github.event_name == 'schedule' && github.event.schedule == '10 21 * * *') || (github.event_name == 'workflow_dispatch' && inputs.job != 'summary')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: count
        run: python3 scripts/risk_calendar.py
      - name: conflicts
        continue-on-error: true
        run: |
          d=$(TZ=Asia/Seoul date +%-d)
          if [ "$d" -ge 21 ] && [ "$d" -le 28 ] || [ ! -f data/conflicts.json ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            python3 scripts/ucdp_month.py
          else
            echo "skip — 매달 21~28일만(오늘 $d일)"
          fi
      - name: imagery
        continue-on-error: true   # 위성영상 분석 글 목록(38 North·Beyond Parallel, 제목·링크·날짜만). 실패 소스는 이전 항목 유지
        run: python3 scripts/imagery_feeds.py
      - name: commit
        run: |
          [ -z "$(git status --porcelain -- data/risk_calendar.json data/conflicts.json data/imagery_reports.json)" ] && { echo unchanged; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/risk_calendar.json $(ls data/conflicts.json data/imagery_reports.json 2>/dev/null)
          git commit -m "calendar: $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
